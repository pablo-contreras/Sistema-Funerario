{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Sistema Funerario</title>
  <link rel="stylesheet" href="{% static 'clientes/app.css' %}">
</head>
<body class="login-body">
  <main class="login-card">
    <img src="{% static 'img/logo.png' %}" alt="Logo funeraria">
    <h1>Sistema Funerario</h1>
    <p>Ingrese con su cuenta para acceder a las fichas.</p>
    {% if form.errors %}<div class="message error">Usuario o contraseña incorrectos.</div>{% endif %}
    <form method="post" class="stack-form">
      {% csrf_token %}
      <label for="id_username">Usuario</label>
      <input class="form-control" type="text" name="username" id="id_username" autofocus required>
      <label for="id_password">Contraseña</label>
      <input class="form-control" type="password" name="password" id="id_password" required>
      <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
